<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Set the character encoding -->
    <meta charset="UTF-8">

    <!-- Make the webpage responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set the webpage title -->
    <title>Customer Churn Prediction</title>

    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <!-- Main container -->
    <div class="container">

        <!-- Project heading -->
        <h1>Customer Churn Prediction</h1>

        <!-- Short project description -->
        <p class="description">
            Enter the customer details below to predict whether
            the customer is likely to churn.
        </p>


        <!-- Customer input form -->
        <form action="/predict" method="POST">

            <!-- Gender -->
            <label for="gender">Gender</label>

            <select name="gender" id="gender" required>

                <option value="Female">Female</option>

                <option value="Male">Male</option>

            </select>


            <!-- Senior Citizen -->
            <label for="SeniorCitizen">Senior Citizen</label>

            <select name="SeniorCitizen" id="SeniorCitizen" required>

                <option value="0">No</option>

                <option value="1">Yes</option>

            </select>


            <!-- Partner -->
            <label for="Partner">Partner</label>

            <select name="Partner" id="Partner" required>

                <option value="No">No</option>

                <option value="Yes">Yes</option>

            </select>


            <!-- Dependents -->
            <label for="Dependents">Dependents</label>

            <select name="Dependents" id="Dependents" required>

                <option value="No">No</option>

                <option value="Yes">Yes</option>

            </select>


            <!-- Tenure -->
            <label for="tenure">Tenure (months)</label>

            <input type="number" name="tenure" id="tenure" min="0" required>


            <!-- Phone Service -->
            <label for="PhoneService">Phone Service</label>

            <select name="PhoneService" id="PhoneService" required>

                <option value="Yes">Yes</option>

                <option value="No">No</option>

            </select>


            <!-- Multiple Lines -->
            <label for="MultipleLines">Multiple Lines</label>

            <select name="MultipleLines" id="MultipleLines" required>

                <option value="No">No</option>

                <option value="Yes">Yes</option>

                <option value="No phone service">
                    No phone service
                </option>

            </select>


            <!-- Internet Service -->
            <label for="InternetService">Internet Service</label>

            <select name="InternetService" id="InternetService" required>

                <option value="DSL">DSL</option>

                <option value="Fiber optic">Fiber optic</option>

                <option value="No">No</option>

            </select>


            <!-- Online Security -->
            <label for="OnlineSecurity">Online Security</label>

            <select name="OnlineSecurity" id="OnlineSecurity" required>

                <option value="No">No</option>

                <option value="Yes">Yes</option>

                <option value="No internet service">
                    No internet service
                </option>

            </select>


            <!-- Online Backup -->
            <label for="OnlineBackup">Online Backup</label>

            <select name="OnlineBackup" id="OnlineBackup" required>

                <option value="No">No</option>

                <option value="Yes">Yes</option>

                <option value="No internet service">
                    No internet service
                </option>

            </select>


            <!-- Device Protection -->
            <label for="DeviceProtection">Device Protection</label>

            <select name="DeviceProtection" id="DeviceProtection" required>

                <option value="No">No</option>

                <option value="Yes">Yes</option>

                <option value="No internet service">
                    No internet service
                </option>

            </select>


            <!-- Tech Support -->
            <label for="TechSupport">Tech Support</label>

            <select name="TechSupport" id="TechSupport" required>

                <option value="No">No</option>

                <option value="Yes">Yes</option>

                <option value="No internet service">
                    No internet service
                </option>

            </select>


            <!-- Streaming TV -->
            <label for="StreamingTV">Streaming TV</label>

            <select name="StreamingTV" id="StreamingTV" required>

                <option value="No">No</option>

                <option value="Yes">Yes</option>

                <option value="No internet service">
                    No internet service
                </option>

            </select>


            <!-- Streaming Movies -->
            <label for="StreamingMovies">Streaming Movies</label>

            <select name="StreamingMovies" id="StreamingMovies" required>

                <option value="No">No</option>

                <option value="Yes">Yes</option>

                <option value="No internet service">
                    No internet service
                </option>

            </select>


            <!-- Contract -->
            <label for="Contract">Contract</label>

            <select name="Contract" id="Contract" required>

                <option value="Month-to-month">
                    Month-to-month
                </option>

                <option value="One year">
                    One year
                </option>

                <option value="Two year">
                    Two year
                </option>

            </select>


            <!-- Paperless Billing -->
            <label for="PaperlessBilling">
                Paperless Billing
            </label>

            <select name="PaperlessBilling" id="PaperlessBilling" required>

                <option value="Yes">Yes</option>

                <option value="No">No</option>

            </select>


            <!-- Payment Method -->
            <label for="PaymentMethod">
                Payment Method
            </label>

            <select name="PaymentMethod" id="PaymentMethod" required>

                <option value="Electronic check">
                    Electronic check
                </option>

                <option value="Mailed check">
                    Mailed check
                </option>

                <option value="Bank transfer (automatic)">
                    Bank transfer (automatic)
                </option>

                <option value="Credit card (automatic)">
                    Credit card (automatic)
                </option>

            </select>


            <!-- Monthly Charges -->
            <label for="MonthlyCharges">
                Monthly Charges
            </label>

            <input type="number" name="MonthlyCharges" id="MonthlyCharges" step="0.01" min="0" required>


            <!-- Total Charges -->
            <label for="TotalCharges">
                Total Charges
            </label>

            <input type="number" name="TotalCharges" id="TotalCharges" step="0.01" min="0" required>


            <!-- Prediction button -->
            <button type="submit">
                Predict Churn
            </button>

        </form>


        <!-- Display the prediction result -->
        {% if prediction %}

        <div class="result">

            <!-- Display the prediction -->
            <h2>{{ prediction }}</h2>

            <!-- Display the churn probability -->
            <p>
                Predicted churn probability:
                <strong>{{ probability }}%</strong>
            </p>

        </div>

        {% endif %}


    </div>

</body>

</html>
